<style>
.topbar{position:relative!important}
.testimonials-home .section-head{margin-bottom:2.4rem}
.quote-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.quote-card{display:flex;flex-direction:column;margin:0;border:1px solid var(--line);border-radius:18px;background:var(--paper-2);padding:1.6rem 1.5rem 1.4rem;box-shadow:0 12px 28px rgba(27,38,49,.14)}
.quote-card__mark{font:600 4rem/.6 'Fraunces',Georgia,serif;color:var(--accent);height:1.6rem;margin-bottom:.6rem}
.quote-card blockquote{margin:0 0 1.4rem;flex:1;font:400 1.12rem/1.55 'Fraunces',Georgia,serif;color:var(--ink)}
.quote-card blockquote strong{font-weight:600;background:linear-gradient(transparent 62%,rgba(165,200,214,.55) 62%)}
.quote-card figcaption{display:flex;gap:.85rem;align-items:center;padding-top:1.1rem;border-top:1px solid var(--line)}
.quote-card__avatar{flex:none;display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--accent);color:#fff;font:800 .85rem/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.quote-card__who b{display:block;font-size:.98rem}
.quote-card__who span{display:block;color:var(--muted);font-size:.86rem;line-height:1.35}
.quote-card__tag{display:inline-block;margin-top:.35rem;font:700 .66rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2)}
@media (max-width:900px){.quote-grid{grid-template-columns:1fr}}
</style>
</head>

        <figcaption><span class="quote-card__avatar">FL</span><span class="quote-card__who"><b>First Last</b><span>Plant Manager, Basic American Foods</span><em class="quote-card__tag">Worked with Ankit · 2026</em></span></figcaption>

        <figcaption><span class="quote-card__avatar">FL</span><span class="quote-card__who"><b>Dr. First Last</b><span>Professor of Mechanical Engineering, BYU&#8211;Idaho</span><em class="quote-card__tag">Taught Ankit · ME 372</em></span></figcaption>
      </figure>

  </div>
